<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Segoe UI",system-ui,sans-serif;
  --text:#1d1d1f;--text2:#5e5e63;--text3:#8a8a8e;--line:rgba(0,0,0,.09);--hover:rgba(0,0,0,.06);--chip:rgba(120,120,128,.12);
  --glass:rgba(240,240,245,.6);--pane:rgba(255,255,255,.8);--side:rgba(236,236,241,.42);--edge:rgba(255,255,255,.55);
  --bar:rgba(246,246,250,.46);--dockbg:rgba(255,255,255,.24);--accent:#0A84FF;
  --shadow:0 24px 70px rgba(0,0,0,.34),0 0 0 .5px rgba(0,0,0,.24);
  --blur:28px;
  /* WALLPAPER: a file named wallpaper.jpg next to this page is picked up by itself (see setWallpaper) */
  --wall:none;
  --wall-fallback:radial-gradient(1100px 760px at 18% 16%,#3d6aa0 0%,transparent 62%),radial-gradient(1000px 700px at 82% 74%,#2c8173 0%,transparent 58%),linear-gradient(140deg,#1a2740,#123c3b);
}
:root[data-theme=dark]{--text:#f5f5f7;--text2:#b4b4b9;--text3:#8e8e93;--line:rgba(255,255,255,.1);--hover:rgba(255,255,255,.08);--chip:rgba(120,120,128,.24);
  --glass:rgba(38,38,44,.62);--pane:rgba(28,28,32,.8);--side:rgba(44,44,50,.4);--edge:rgba(255,255,255,.14);--bar:rgba(28,28,32,.5);--dockbg:rgba(40,40,46,.34)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--text:#f5f5f7;--text2:#b4b4b9;--text3:#8e8e93;--line:rgba(255,255,255,.1);--hover:rgba(255,255,255,.08);--chip:rgba(120,120,128,.24);
  --glass:rgba(38,38,44,.62);--pane:rgba(28,28,32,.8);--side:rgba(44,44,50,.4);--edge:rgba(255,255,255,.14);--bar:rgba(28,28,32,.5);--dockbg:rgba(40,40,46,.34)}}
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden}
body{font:400 14px/1.45 var(--font);color:var(--text);background:#111;-webkit-font-smoothing:antialiased;user-select:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
a{color:var(--accent);text-decoration:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.wall{position:fixed;inset:0;z-index:0;background:var(--wall) center/cover no-repeat,var(--wall-fallback)}
.wall::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.2),transparent 22%,transparent 70%,rgba(0,0,0,.3))}

/* ---------------------------------------------------------------- the menu bar: the system, never the content */
.menubar{position:fixed;left:0;right:0;top:0;height:28px;z-index:900;display:flex;align-items:center;gap:1px;padding:0 8px;font:500 13px/1 var(--font);background:var(--bar);-webkit-backdrop-filter:blur(30px) saturate(1.8);backdrop-filter:blur(30px) saturate(1.8);border-bottom:.5px solid rgba(0,0,0,.08)}
.menubar>button,.menubar .mi{height:22px;padding:0 9px;border-radius:5px;display:flex;align-items:center;gap:6px;white-space:nowrap}
.menubar>button:hover,.menubar>button.open{background:var(--hover)}
.menubar .logo{font:800 11.5px/1 var(--font);letter-spacing:.03em;padding:0 10px}
.menubar .app{font-weight:700}
.menubar .sp{flex:1}
.menubar .clock{font-variant-numeric:tabular-nums}
.menubar svg{display:block}
.pop{position:fixed;z-index:950;min-width:230px;padding:5px;border-radius:9px;background:var(--glass);-webkit-backdrop-filter:blur(30px) saturate(1.8);backdrop-filter:blur(30px) saturate(1.8);border:.5px solid var(--edge);box-shadow:0 14px 40px rgba(0,0,0,.28),0 0 0 .5px rgba(0,0,0,.2);font:400 13px/1 var(--font)}
.pop[hidden]{display:none}
.pop button{display:flex;width:100%;align-items:center;gap:8px;padding:6px 10px;border-radius:5px;text-align:left}
.pop button:hover{background:var(--accent);color:#fff}
.pop .chk{width:12px;flex:none}
.pop .k{margin-left:auto;padding-left:24px;color:var(--text3)}
.pop button:hover .k{color:rgba(255,255,255,.85)}
.pop hr{border:0;height:1px;background:var(--line);margin:5px 8px}

/* ---------------------------------------------------------------- the desktop: his work, as apps and files */
.desk{position:fixed;top:44px;right:14px;bottom:100px;z-index:2;display:flex;flex-direction:column;flex-wrap:wrap-reverse;align-content:flex-start;gap:12px 8px}
.dicon{width:100px;display:flex;flex-direction:column;align-items:center;gap:6px;padding:6px 2px;border-radius:9px}
.dicon .art{width:66px;height:66px;display:grid;place-items:center;border-radius:12px;filter:drop-shadow(0 5px 10px rgba(0,0,0,.35))}
.dicon .lbl{max-width:98px;padding:2px 6px;border-radius:4px;font:600 12px/1.25 var(--font);color:#fff;text-align:center;text-shadow:0 1px 3px rgba(0,0,0,.75)}
.dicon:hover .art{background:rgba(255,255,255,.12)}
.dicon.sel .art{background:rgba(255,255,255,.2)}
.dicon.sel .lbl{background:var(--accent);text-shadow:none}
.dicon .lbl small{display:block;margin-top:1px;font-weight:500;font-size:11px;color:#a9d1ff}
.dicon.sel .lbl small{color:#fff}
.dicon.cv{margin-top:6px}
.dhd{align-self:center;padding:4px 10px;border-radius:999px;background:rgba(0,0,0,.26);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);font:600 12px/1 var(--font);color:#fff;letter-spacing:.01em}
.appic{display:grid;place-items:center;color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.4),inset 0 -1px 0 rgba(0,0,0,.18)}
.appic svg{width:52%;height:52%}

/* ---------------------------------------------------------------- widgets */
.widgets{position:fixed;top:44px;left:16px;z-index:2;display:grid;gap:14px}
.wdg{width:168px;height:168px;border-radius:26px;background:rgba(255,255,255,.32);-webkit-backdrop-filter:blur(24px) saturate(1.6);backdrop-filter:blur(24px) saturate(1.6);border:.5px solid rgba(255,255,255,.45);box-shadow:0 12px 30px rgba(0,0,0,.22);display:grid;place-items:center}
.wdg svg{width:150px;height:150px}

/* ---------------------------------------------------------------- the dock: the ways to explore */
.dock{position:fixed;left:50%;bottom:8px;transform:translateX(-50%);z-index:800;display:flex;align-items:flex-end;gap:5px;padding:6px 8px;border-radius:22px;background:var(--dockbg);-webkit-backdrop-filter:blur(26px) saturate(1.8);backdrop-filter:blur(26px) saturate(1.8);border:.5px solid rgba(255,255,255,.4);box-shadow:0 10px 40px rgba(0,0,0,.28)}
.dk{position:relative;width:54px;height:54px;flex:none;transition:width .1s ease,height .1s ease}
.dk>.ic{display:block;width:100%;height:100%}
.dk>.ic>svg,.dk>.ic>.appic{width:100%;height:100%;border-radius:23%}
.dk .tip{position:absolute;bottom:calc(100% + 12px);left:50%;transform:translateX(-50%);padding:5px 10px;border-radius:7px;background:var(--glass);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);font:500 12px/1 var(--font);white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .12s;color:var(--text);box-shadow:0 4px 14px rgba(0,0,0,.22)}
.dk:hover .tip,.dk:focus-visible .tip{opacity:1}
.dk.on::after{content:'';position:absolute;left:50%;bottom:-5px;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:rgba(255,255,255,.9)}
.dsep{width:1px;align-self:stretch;margin:6px 3px;background:rgba(255,255,255,.4)}

/* ---------------------------------------------------------------- windows: glass, like macOS */
.win{position:fixed;z-index:10;display:flex;flex-direction:column;min-width:300px;min-height:160px;border-radius:12px;background:var(--glass);-webkit-backdrop-filter:blur(var(--blur)) saturate(1.8);backdrop-filter:blur(var(--blur)) saturate(1.8);border:.5px solid var(--edge);box-shadow:var(--shadow);overflow:hidden;animation:winIn .22s cubic-bezier(.2,.8,.2,1)}
@keyframes winIn{from{opacity:0;transform:scale(.965)}}
.win.min{display:none}
.win.max{left:0!important;top:28px!important;width:100%!important;height:calc(100% - 28px)!important;max-height:none!important;border-radius:0}
.tb{height:34px;flex:none;display:flex;align-items:center;gap:10px;padding:0 12px;cursor:default}
.lights{display:flex;gap:8px;width:52px;flex:none}
.lights button{position:relative;width:12px;height:12px;border-radius:50%;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.2)}
.lights .c{background:#FF5F57}.lights .m{background:#FEBC2E}.lights .x{background:#28C840}
.win:not(.front) .lights button{background:rgba(128,128,128,.38)}
.lights button::after{position:absolute;inset:0;display:grid;place-items:center;font:700 9.5px/1 var(--font);color:rgba(0,0,0,.6);opacity:0}
.lights .c::after{content:'×'}.lights .m::after{content:'−'}.lights .x::after{content:'+'}
.lights:hover button::after{opacity:1}
.ttl{flex:1;text-align:center;font:600 13px/1 var(--font);color:var(--text3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.win.front .ttl{color:var(--text)}
.tbx{width:52px;flex:none;display:flex;justify-content:flex-end}
.wc{flex:1;min-height:0;overflow:auto;background:var(--pane);user-select:text}
.rz{position:absolute;right:0;bottom:0;width:18px;height:18px;cursor:nwse-resize}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:28px;padding:0 14px;border-radius:7px;background:var(--chip);font:500 13px/1 var(--font);color:var(--text);white-space:nowrap}
.btn:hover{filter:brightness(.96)}
.btn.p{background:var(--accent);color:#fff}

/* about Hussein, like About This Mac */
.about{padding:24px 30px 22px;text-align:center}
.av{width:116px;height:116px;margin:0 auto 14px;border-radius:50%;background:linear-gradient(160deg,#33496a,#141c29) center 22%/cover;display:grid;place-items:center;color:#fff;font:700 40px/1 var(--font);box-shadow:0 8px 22px rgba(0,0,0,.28)}
.av.ph{color:transparent}
.about h1{font:700 25px/1.15 var(--font)}
.about .sub{margin-top:5px;color:var(--text2);font-size:13px}
.about .head{margin:14px auto 0;max-width:380px;font:600 14.5px/1.42 var(--font);text-wrap:balance}
.about dl{margin:18px auto 0;display:grid;grid-template-columns:auto 1fr;gap:7px 12px;text-align:left;max-width:390px;font-size:12.5px;line-height:1.35}
.about dt{color:var(--text2);text-align:right;font-weight:600;white-space:nowrap}
.about .acts{margin-top:20px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.about2{display:grid;grid-template-columns:minmax(0,1.08fr) minmax(0,1fr)}
.about2 .about{padding:24px 26px 22px}
.aproj{display:flex;flex-direction:column;justify-content:center;padding:26px 24px 22px;border-left:.5px solid var(--line)}
.aproj h2{font:700 17px/1.2 var(--font)}
.aproj>p{margin-top:5px;color:var(--text2);font-size:12.5px;line-height:1.4}
.plist{margin-top:14px;border-radius:12px;background:var(--s-bg);box-shadow:0 0 0 .5px var(--s-line),0 1px 2px rgba(0,0,0,.04);overflow:hidden}
.prow{display:grid;grid-template-columns:40px minmax(0,1fr) 10px;align-items:center;gap:12px;width:100%;padding:11px 14px 11px 12px;text-align:left;border-bottom:.5px solid var(--s-line)}
.prow:last-child{border-bottom:0}
.prow:hover{background:var(--hover)}
.prow:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.prow b{display:block;font:600 14px/1.25 var(--font)}
.prow .pl{display:block;margin-top:2px;color:var(--text2);font-size:12.5px;line-height:1.35}
.chev{width:10px;height:10px;fill:none;stroke:var(--text3);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.win[data-key=about] .wc{container-type:inline-size}
@container (max-width:700px){.about2{grid-template-columns:1fr}.aproj{border-left:0;border-top:.5px solid var(--line);padding-top:20px}}

/* Files, like Finder */
.win[data-key=files] .wc,.win[data-key=notes] .wc{background:transparent}
.finder{display:flex;height:100%}
.side{width:180px;flex:none;padding:10px 8px;background:var(--side);border-right:.5px solid var(--line);overflow:auto}
.side p{font:700 11px/1 var(--font);color:var(--text3);padding:10px 8px 6px}
.side button{display:flex;align-items:center;gap:8px;width:100%;padding:6px 8px;border-radius:6px;font-size:13px;text-align:left}
.side button.on{background:rgba(120,120,128,.2)}
.side svg{width:16px;height:16px;flex:none;color:var(--accent)}
.fmain{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--pane)}
.fgrid{flex:1;display:grid;grid-template-columns:repeat(auto-fill,minmax(124px,1fr));gap:16px;padding:22px;align-content:start;overflow:auto}
.fitem{display:flex;flex-direction:column;align-items:center;gap:7px;padding:10px 6px;border-radius:9px;text-align:center}
.fitem:hover{background:var(--hover)}
.fitem .l{font:500 12.5px/1.25 var(--font)}
.fitem .s{font-size:11px;color:var(--text3)}
.fstat{padding:6px 12px;font-size:11px;color:var(--text3);border-top:.5px solid var(--line);text-align:center}

/* a project window */
.proj{padding:22px 26px 26px}
.proj .hd{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.proj .org{font:700 20px/1.1 var(--font)}
.proj .orgsub{font-size:12.5px;color:var(--text2);margin-top:4px}
.pill{margin-left:auto;display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;background:rgba(52,199,89,.15);color:#1d8a40;font:600 12px/1 var(--font)}
.pill i{width:7px;height:7px;border-radius:50%;background:#34C759;animation:pulse 2s ease-out infinite}
@keyframes pulse{70%{box-shadow:0 0 0 6px rgba(52,199,89,0)}0%{box-shadow:0 0 0 0 rgba(52,199,89,.5)}}
.pill.done{background:var(--chip);color:var(--text2)}.pill.done i{background:#8e8e93;animation:none}
.proj h2{margin-top:18px;font:700 21px/1.28 var(--font);max-width:720px;text-wrap:balance}
.proj .intro{margin-top:8px;color:var(--text2);font-size:14.5px;line-height:1.55;max-width:720px;text-wrap:pretty}
.metrics{margin:18px 0 0;padding:0;list-style:none;display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));gap:10px}
.metrics li{padding:12px 14px;border-radius:11px;background:var(--chip)}
.metrics .v{font:700 23px/1.1 var(--font);font-variant-numeric:tabular-nums}
.metrics .f{font:500 12.5px/1 var(--font);color:var(--text3);text-decoration:line-through;margin-right:7px}
.metrics .l{display:block;margin-top:5px;font-size:12px;color:var(--text2);line-height:1.3}
.proj h3{margin-top:26px;font:700 15px/1.3 var(--font)}
.built{margin-top:8px;padding-left:18px}
.built li{margin-top:7px;font-size:14px;line-height:1.5}
.facts{margin-top:18px;display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:13px}
.facts dt{color:var(--text3);font-weight:600}
.private{margin-top:16px;font-size:12.5px;color:var(--text2)}
.proj .sum{margin-top:8px;font-size:15.5px;line-height:1.55;max-width:720px;text-wrap:pretty}
.proj .see{margin-top:6px;color:var(--text2);font-size:14.5px;line-height:1.55;max-width:720px;text-wrap:pretty}
.proj .see+.demo{margin-top:14px}
/* the screen and the caption that explains it */
.demo{--a:var(--ac);margin:18px 0 0}
:root[data-theme=dark] .demo{--a:var(--ac2)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .demo{--a:var(--ac2)}}
.demo .shot{margin-top:0}
.guide{margin:10px 0 0;padding:0;list-style:none;display:grid;grid-template-columns:repeat(auto-fit,minmax(176px,1fr));gap:6px}
.guide li{display:grid;grid-template-columns:20px minmax(0,1fr);gap:10px;padding:10px 12px 11px;border-radius:11px;font-size:12.5px;line-height:1.42;color:var(--text2);transition:background .35s var(--ease)}
.guide li b{display:block;margin-bottom:2px;font-size:13px;font-weight:600;color:var(--text)}
.guide li[data-g].on,.guide li[data-g]:hover,.guide li[data-g]:focus-visible{background:color-mix(in srgb,var(--a) 10%,transparent);outline:none}
.gn,.gm{display:inline-grid;place-items:center;flex:none;border-radius:50%;background:var(--a);color:#fff;font:700 11px/1 var(--font);font-variant-numeric:tabular-nums}
.gn{width:20px;height:20px;margin-top:-1px}
.gm{width:17px;height:17px;font-size:10px;transition:box-shadow .35s var(--ease)}
.gm.on,.gm.hov{box-shadow:0 0 0 4px color-mix(in srgb,var(--a) 24%,transparent)}
.guide .hint{align-items:center;color:var(--text3)}
.guide .hint .i{width:16px;height:16px;justify-self:center;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.shot [data-g]{transition:box-shadow .35s var(--ease),background .35s var(--ease)}
.shot [data-g].gon,.shot [data-g].ghov{box-shadow:0 0 0 2px var(--a),0 0 0 6px color-mix(in srgb,var(--a) 16%,transparent)}
.shot .half[data-g].gon,.shot .half[data-g].ghov{box-shadow:inset 0 0 0 2px var(--a)}
.shot .nfoot[data-g].gon,.shot .nfoot[data-g].ghov{box-shadow:none;background:color-mix(in srgb,var(--a) 9%,transparent)}

/* step 2: each system shown as its own product screen (illustrations; KMS and Al-Nahrain are private) */
:root{--s-bg:#fff;--s-bar:#f7f7f9;--s-sub:#f1f1f4;--s-line:rgba(0,0,0,.08);--paper2:#f1ebe0;
  --ok-bg:rgba(52,199,89,.15);--ok-tx:#1c7a34;--wa-bg:rgba(255,159,10,.17);--wa-tx:#965600;--in-bg:rgba(10,132,255,.13);--in-tx:#0a5bd8;--ease:cubic-bezier(.2,.9,.25,1)}
:root[data-theme=dark]{--s-bg:#1c1c1f;--s-bar:#242428;--s-sub:#2b2b30;--s-line:rgba(255,255,255,.09);--paper2:#2a2621;--ok-tx:#5bd27a;--wa-tx:#ffb340;--in-tx:#5aa9ff}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--s-bg:#1c1c1f;--s-bar:#242428;--s-sub:#2b2b30;--s-line:rgba(255,255,255,.09);--paper2:#2a2621;--ok-tx:#5bd27a;--wa-tx:#ffb340;--in-tx:#5aa9ff}}
.shot{--a:var(--ac);margin-top:18px;border-radius:14px;overflow:hidden;background:var(--s-bg);box-shadow:0 0 0 .5px var(--s-line),0 1px 1px rgba(0,0,0,.04),0 16px 36px -16px rgba(0,0,0,.28);font-size:12.5px;line-height:1.35;user-select:none}
:root[data-theme=dark] .shot{--a:var(--ac2)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .shot{--a:var(--ac2)}}
.shot .i{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.sbar{display:flex;align-items:center;gap:10px;height:38px;padding:0 8px 0 12px;background:var(--s-bar);border-bottom:.5px solid var(--s-line)}
.sbar .app{display:flex;align-items:center;gap:7px;font-weight:600}
.sbar .app .i{color:var(--a)}
.sbar .ctx{color:var(--text3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sbar .ill{margin-left:auto;padding:3px 9px;border-radius:999px;background:var(--s-sub);color:var(--text2);font-size:11px;cursor:help;white-space:nowrap}
.sbar .rp{flex:none;width:26px;height:26px;border-radius:7px;display:grid;place-items:center;color:var(--text2)}
.sbar .rp:hover{background:var(--hover)}
.sbody{padding:14px}
.pane{border-radius:11px;background:var(--s-bg);box-shadow:0 0 0 .5px var(--s-line),0 1px 2px rgba(0,0,0,.04)}
.ph{display:flex;align-items:center;gap:8px;min-height:38px;padding:0 12px;border-bottom:.5px solid var(--s-line);font-weight:600}
.ph .i{color:var(--text3)}
.ph .r{margin-left:auto;font-weight:500;color:var(--text3);font-variant-numeric:tabular-nums;white-space:nowrap}
.ph .r b{font-weight:600;color:var(--text)}
.pill2{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 9px;border-radius:999px;font-size:11.5px;font-weight:600;white-space:nowrap;transition:background .35s,color .35s}
.pill2.ok{background:var(--ok-bg);color:var(--ok-tx)}.pill2.wa{background:var(--wa-bg);color:var(--wa-tx)}.pill2.in{background:var(--in-bg);color:var(--in-tx)}.pill2.mu{background:var(--s-sub);color:var(--text2)}
.mono{font-size:11.5px;font-weight:500;color:var(--text3);font-variant-numeric:tabular-nums;white-space:nowrap}
.code{font:500 11.5px/1 ui-monospace,"SF Mono",Menlo,monospace;color:var(--text2)}
/* KMS: the interlock, then the work, then the question */
.kms{display:grid;grid-template-columns:1.45fr 1fr;gap:12px}
.wo{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:12px;padding:9px 12px;border-bottom:.5px solid var(--s-line)}
.wo:last-child{border-bottom:0}
.wo .eq{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.wo .eq small{display:block;margin-top:2px;font-size:11px;font-weight:400;color:var(--text3)}
.wo.hl{background:color-mix(in srgb,var(--a) 7%,transparent)}
.ptw{margin-top:12px;padding:12px}
.ptw .top{display:flex;align-items:center;gap:8px}
.ptw .top .i{color:var(--a)}
.ptw .top b{font-size:13px}
.ptw .top .pill2{margin-left:auto}
.ptw .sub{margin:3px 0 0 49px;color:var(--text3);font-size:11.5px}
.ptw ol{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:9px}
.ptw li{display:grid;grid-template-columns:22px minmax(0,1fr) auto;align-items:center;gap:9px;color:var(--text3);transition:color .35s}
.ptw li:not(.ok) .mono{visibility:hidden}
.ptw .dot{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--s-sub);color:var(--text3);transition:background .35s,color .35s}
.ptw .dot .i{width:12px;height:12px}
.ptw li.on,.ptw li.ok{color:var(--text)}
.ptw li.on .dot{background:var(--a);color:#fff}
.ptw li.ok .dot{background:#34C759;color:#fff}
.locks{display:flex;gap:4px}
.locks span{width:20px;height:20px;border-radius:6px;display:grid;place-items:center;background:var(--s-sub);color:var(--text3);transition:background .3s var(--ease),color .3s,transform .3s var(--ease)}
.locks span .i{width:11px;height:11px}
.locks span.on{background:color-mix(in srgb,var(--a) 16%,transparent);color:var(--a);transform:scale(1.08)}
.asst{display:flex;flex-direction:column;min-width:0}
.asst .msgs{flex:1;display:flex;flex-direction:column;gap:9px;padding:12px}
.bub{max-width:90%;padding:8px 11px;border-radius:15px;opacity:0;transform:translateY(6px);transition:opacity .4s var(--ease),transform .4s var(--ease)}
.bub.in{opacity:1;transform:none}
.bub.q{align-self:flex-end;background:#0A84FF;color:#fff;border-bottom-right-radius:5px}
.bub.a{align-self:stretch;max-width:none;background:var(--s-sub);border-bottom-left-radius:5px}
.bub.a b{font-weight:600}
.typing{align-self:flex-start;display:none;gap:4px;padding:10px 12px;border-radius:15px;background:var(--s-sub)}
.typing.in{display:flex}
.typing i{width:5px;height:5px;border-radius:50%;background:var(--text3);animation:typ 1.1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes typ{0%,60%,100%{opacity:.3}30%{opacity:1}}
.rank{margin-top:9px;display:grid;gap:7px}
.rank em{display:block;margin-bottom:3px;font-style:normal;font-size:11.5px;color:var(--text2)}
.rank span{display:block;height:6px;width:0;border-radius:3px;background:var(--a);transition:width .9s var(--ease)}
.sugg{margin-top:auto;display:flex;flex-wrap:wrap;gap:6px;opacity:0;transition:opacity .45s var(--ease)}
.sugg.in{opacity:1}
.sugg span{padding:5px 10px;border-radius:999px;box-shadow:inset 0 0 0 1px var(--s-line);color:var(--text2);font-size:11.5px}
.asst .tool{display:flex;align-items:center;gap:7px;padding:9px 12px;border-top:.5px solid var(--s-line);color:var(--text3);font-size:11.5px}
/* Apicbase: each outlet's events, in order */
.flow{--cols:112px minmax(0,1fr) 92px 92px}
.fhead{display:grid;grid-template-columns:var(--cols);gap:10px;padding:0 2px 6px;color:var(--text3);font-size:11.5px}
.fhead>span{display:flex;align-items:center;gap:6px;min-width:0}
.flane{position:relative;display:grid;grid-template-columns:var(--cols);gap:10px;align-items:center;height:44px}
.node{height:34px;border-radius:9px;display:flex;align-items:center;gap:7px;padding:0 10px;background:var(--s-bg);box-shadow:0 0 0 .5px var(--s-line),0 1px 2px rgba(0,0,0,.05);font-weight:600;font-size:12px;white-space:nowrap;transition:box-shadow .25s}
.node .i{color:var(--text3)}
.qgrp{position:relative;height:34px;border-radius:9px;background:var(--s-sub);box-shadow:inset 0 0 0 .5px var(--s-line);overflow:hidden}
.qgrp::before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 21px,var(--s-line) 21px 22px)}
.wk{justify-content:center}
.wk.busy{box-shadow:0 0 0 1.5px var(--a),0 1px 2px rgba(0,0,0,.05)}
.wk.busy .i{color:var(--a);animation:spin 1.2s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.st{justify-content:space-between}
.st em{font-style:normal;font-size:12px;font-weight:600;color:var(--text2);font-variant-numeric:tabular-nums}
.st.flash{animation:flash .8s ease}
@keyframes flash{0%{box-shadow:0 0 0 2px #34C759}100%{box-shadow:0 0 0 .5px var(--s-line)}}
.pkt{position:absolute;top:50%;left:0;z-index:2;height:24px;margin-top:-12px;padding:0 8px;border-radius:7px;display:flex;align-items:center;gap:5px;font-size:11px;font-weight:600;color:#fff;white-space:nowrap;box-shadow:0 2px 6px rgba(0,0,0,.2);opacity:0}
.pkt .i{width:12px;height:12px}
.pkt .n{opacity:.85;font-variant-numeric:tabular-nums}
.fnote{margin-top:8px;display:flex;align-items:center;gap:7px;color:var(--ok-tx);font-size:12px;font-weight:600}
.fnote .i{width:14px;height:14px}
.evl{margin-top:14px}
.evl .ph .r{display:flex;align-items:center;gap:7px}
.evl .ph .r i{width:7px;height:7px;border-radius:50%;background:#34C759;box-shadow:0 0 0 3px rgba(52,199,89,.18)}
.evs{position:relative;height:184px;overflow:hidden}
.ev{display:grid;grid-template-columns:26px minmax(0,1fr) auto auto;align-items:center;gap:10px;height:46px;padding:0 12px;border-bottom:.5px solid var(--s-line)}
.ev .ki{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;color:#fff}
.ev .ki .i{width:14px;height:14px}
.ev b{display:block;font-weight:600}
.ev small{display:block;margin-top:1px;font-size:11px;color:var(--text3)}
/* Al-Nahrain: one college, the council, then seven colleges */
.nah{display:grid;grid-template-columns:1.55fr 1fr;gap:12px}
.nah>.pane:first-child{display:flex;flex-direction:column}
.ten{flex:1;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-auto-rows:1fr;gap:8px;padding:12px}
.cell{min-height:74px;border-radius:10px;padding:9px 10px;background:var(--s-sub);display:flex;flex-direction:column;justify-content:space-between;transition:background .5s var(--ease),box-shadow .5s var(--ease)}
.cell .i{color:var(--text3);transition:color .5s}
.cell .nm{font-weight:600;font-size:12px;line-height:1.2;hyphens:manual;overflow-wrap:break-word}
.cell .n1{margin-left:8px;font-style:normal;font-weight:500;font-size:11px;color:var(--text3)}
.cell.on .n1{color:var(--a)}
.cell .lb{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--text3)}
.cell .lb i{width:6px;height:6px;border-radius:50%;background:#c7c7cc;transition:background .4s}
.cell .lb b{font-weight:500}
.cell.first{grid-column:1/-1}
.cell.on{background:color-mix(in srgb,var(--a) 11%,var(--s-bg));box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--a) 32%,transparent)}
.cell.on .i{color:var(--a)}.cell.on .lb{color:var(--text)}.cell.on .lb i{background:#34C759}
.log{margin:0;padding:6px 12px 4px;list-style:none}
.log li{position:relative;display:grid;grid-template-columns:12px minmax(0,1fr);gap:11px;padding:8px 0;color:var(--text3);transition:color .45s}
.log li::before{content:'';width:9px;height:9px;margin-top:3px;border-radius:50%;box-shadow:inset 0 0 0 1.5px #c7c7cc;transition:background .45s,box-shadow .45s}
.log li::after{content:'';position:absolute;left:4px;top:23px;bottom:-5px;width:1px;background:var(--s-line)}
.log li:last-child::after{display:none}
.log li.on{color:var(--text)}
.log li.on::before{background:var(--a);box-shadow:none}
.log b{display:block;font-weight:600;font-size:12px}
.log span{font-size:11.5px;color:var(--text2)}
.nfoot{display:flex;align-items:center;gap:8px;padding:10px 12px;border-top:.5px solid var(--s-line);border-radius:0 0 11px 11px;font-weight:600}
.nfoot .i{color:var(--a)}
/* Al-Hadi: paper on the left, the portal on the right */
.ba2{position:relative;--x:100%;height:284px;border-radius:11px;overflow:hidden;box-shadow:0 0 0 .5px var(--s-line);touch-action:none;cursor:ew-resize}
.ba2 .half{position:absolute;inset:0;display:flex;align-items:center;gap:20px;padding:26px 28px}
.ba2 .before{background:var(--paper2)}
.ba2 .after{justify-content:flex-end;background:var(--s-bg);clip-path:inset(0 0 0 var(--x))}
.ba2 .lbl2{position:absolute;top:11px;display:flex;align-items:center;gap:5px;padding:3px 8px;border-radius:6px;font-size:11px;font-weight:600}
.ba2 .before .lbl2{left:11px;background:rgba(120,110,90,.16);color:var(--text2)}
.ba2 .after .lbl2{right:11px;background:var(--ok-bg);color:var(--ok-tx)}
.tkt{flex:none;width:140px;padding:12px 14px;border-radius:10px;background:#fff;color:#1d1d1f;box-shadow:0 1px 1px rgba(0,0,0,.06),0 10px 20px -10px rgba(0,0,0,.3);transform:rotate(-3deg)}
.tkt>.i{color:#965600}
.tkt .k{margin-top:7px;font-size:10.5px;color:#8a8a8e}
.tkt .no{margin-top:1px;font-size:34px;font-weight:700;line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.tkt .w{margin-top:2px;font-size:11.5px;color:#5e5e63}
.tkt hr{margin:10px -14px 0;border:0;border-top:1px dashed #d1d1d6}
.tkt .v{display:flex;align-items:center;gap:5px;margin-top:2px;font-weight:600;font-size:12.5px;color:#c2410c}
.tkt .v .i{width:13px;height:13px}
.sheet2{flex:none;display:flex;flex-direction:column;gap:8px;width:158px;height:190px;padding:12px;border-radius:3px;background:#fbf8f1;color:#1d1d1f;box-shadow:0 1px 1px rgba(0,0,0,.06),0 10px 20px -10px rgba(0,0,0,.3);transform:rotate(2.5deg)}
.sheet2 .tt{display:flex;align-items:center;gap:6px;font-weight:600;font-size:12px}
.sheet2 .tt .i{color:#7d7464}
.sheet2 .ruled{flex:1;min-height:0;background:repeating-linear-gradient(transparent 0 13px,#e5ddcc 13px 14px)}
.sheet2 .ruled svg{display:block;width:100%;height:100%;fill:none;stroke:#7d7464;stroke-width:1.3;stroke-linecap:round}
.sheet2 .fn{font-size:10.5px;line-height:1.3;color:#8a7f6b}
.phone2{flex:none;width:150px;height:248px;padding:7px;border-radius:28px;background:#1d1d1f;box-shadow:0 0 0 1.5px #4a4a4f,0 1px 1px rgba(0,0,0,.1),0 14px 28px -12px rgba(0,0,0,.45)}
.scr2{position:relative;height:100%;border-radius:22px;background:#f2f2f7;padding:26px 9px 9px;color:#1d1d1f;display:flex;flex-direction:column;gap:7px;overflow:hidden}
.scr2::before{content:"";position:absolute;top:7px;left:50%;width:40px;height:11px;margin-left:-20px;border-radius:6px;background:#1d1d1f}
.scr2 .pt{font-weight:700;font-size:13px}
.card2{padding:8px 9px;border-radius:10px;background:#fff;font-size:11px}
.card2 b{display:block;font-weight:600;font-size:11px}
.card2 .rw{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-top:6px}
.card2 .pill2{height:18px;padding:0 6px;font-size:10px;background:rgba(52,199,89,.16);color:#1c7a34}
.row2{display:flex;align-items:center;justify-content:space-between;gap:6px}
.sk{display:block;height:6px;border-radius:3px;background:#e5e5ea}
.cert2{flex:none;width:178px;padding:14px;border-radius:11px;background:#fff;color:#1d1d1f;box-shadow:0 0 0 1px color-mix(in srgb,var(--a) 22%,transparent),0 14px 28px -14px rgba(0,0,0,.35);display:grid;gap:8px}
.cert2 .aw{width:24px;height:24px;color:var(--ac);stroke-width:1.4}
.cert2 .ct{font-weight:700;font-size:13px}
.cert2 .lk{display:flex;align-items:center;gap:6px;margin-top:4px;font-size:11.5px;font-weight:600;color:var(--ac)}
.cert2 .lk .i{width:13px;height:13px}
.cert2 .rd{font-size:11.5px;font-weight:600;color:#1c7a34}
.ba2 .divider{position:absolute;top:0;bottom:0;left:var(--x);border-left:2px solid #fff;filter:drop-shadow(0 0 1px rgba(0,0,0,.35))}
.ba2 .divider span{position:absolute;top:50%;left:-1px;width:30px;height:30px;transform:translate(-50%,-50%);border-radius:50%;background:#fff;display:grid;place-items:center;color:#3a3a3c;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.ba2 .divider .i{width:14px;height:14px}
@media (max-width:760px){
  .kms,.nah{grid-template-columns:1fr}
  .wo{grid-template-columns:minmax(0,1fr) auto}
  .wo .mono,.ptw .top .mono{display:none}
  .flow{--cols:28px minmax(0,1fr) 34px 54px}
  .fhead>span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .fhead>span:nth-child(1),.fhead>span:nth-child(3){visibility:hidden}
  .node{padding:0 6px;justify-content:center}
  .node .t,.node.src .i,.st .i{display:none}
  .node.src::after{content:attr(data-k)}
  .fhead>span[data-s]{font-size:0}.fhead>span[data-s]::after{content:attr(data-s);font-size:11.5px}
  .evl .lt{display:none}.evl .ph .r::after{content:'Live'}
  .sbar .ctx{display:none}.sbar .app{white-space:nowrap}
  .wo:nth-child(5),.sugg{display:none}
  .sheet2 .tt .i{display:none}
  .ten{grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-rows:auto}
  .cell{min-height:0;flex-direction:row;align-items:center;gap:7px;padding:10px 9px}
  .cell .nm{flex:1;min-width:0;font-size:11.5px}.cell .n1{display:block;margin:2px 0 0}
  .cell .lb{margin-left:auto}.cell .lb b{display:none}
  .guide{grid-template-columns:1fr;gap:2px}
  .guide li{padding:9px 10px}
  .guide .hint{display:none}
  .fhead>span .gm{visibility:visible}
  .ba2{height:auto;cursor:default}
  .ba2 .half{position:relative;padding:42px 12px 20px;justify-content:center;gap:14px}
  .ba2 .after{clip-path:none}
  .ba2 .divider{display:none}
  .tkt{width:124px;padding:12px}.tkt hr{margin:10px -12px 0}
  .sheet2{width:136px;height:auto;min-height:172px}
  .phone2{width:136px;height:226px}
  .cert2{width:150px;padding:12px}
}
@media (prefers-reduced-motion:reduce){.wk.busy .i,.typing i{animation:none}}

/* Notes: skills, each with its proof */
.notes{display:flex;height:100%}
.nlist{width:250px;flex:none;overflow:auto;border-right:.5px solid var(--line);background:var(--side);padding:8px}
.nlist button{display:block;width:100%;text-align:left;padding:9px 12px;border-radius:8px}
.nlist button.on{background:#FFD52E;color:#1d1d1f}
.nlist b{display:block;font:600 13.5px/1.25 var(--font)}
.nlist span{font-size:12px;color:var(--text3)}
.nlist button.on span{color:rgba(29,29,31,.65)}
.ndoc{flex:1;min-width:0;overflow:auto;padding:24px 30px;background:var(--pane)}
.ndoc h2{font:700 25px/1.15 var(--font)}
.ndoc .lede{margin-top:6px;font-size:12.5px;color:var(--text3)}
.ndoc ul{margin-top:16px;padding:0;list-style:none}
.ndoc li{display:flex;gap:12px;align-items:baseline;padding:11px 0;border-bottom:.5px solid var(--line);font-size:14px;line-height:1.45}
.tag{flex:none;padding:3px 8px;border-radius:6px;font:600 11.5px/1.2 var(--font);color:#fff}
.ndoc li button{margin-left:auto;flex:none;color:var(--accent);font-size:12.5px}

/* Mail */
.mail .row{display:grid;grid-template-columns:72px 1fr;gap:10px;align-items:center;padding:9px 18px;border-bottom:.5px solid var(--line);font-size:13px}
.mail .row label{color:var(--text3);text-align:right}
.mail input,.mail textarea{width:100%;border:0;background:transparent;font:inherit;color:var(--text);outline:none}
.mail textarea{display:block;min-height:170px;padding:14px 18px;resize:none;font-size:14px;line-height:1.5}
.mail .acts{display:flex;gap:8px;flex-wrap:wrap;padding:12px 18px;border-top:.5px solid var(--line)}
.mail .note{padding:0 18px 16px;font-size:12.5px;color:var(--text2)}

/* Preview */
.pv{display:flex;flex-direction:column;height:100%}
.pv iframe{flex:1;border:0;width:100%;background:#fff}
.pv .bar{display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:.5px solid var(--line);font-size:12.5px;color:var(--text2)}
.pv .bar .btn{margin-left:auto}

/* Trash: what his software replaced */
.trash .top{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:.5px solid var(--line);font-size:12.5px;color:var(--text2)}
.trash .top .btn{margin-left:auto}
.trash .row{display:grid;grid-template-columns:38px 1fr auto;gap:14px;align-items:center;padding:11px 16px;border-bottom:.5px solid var(--line)}
.trash .row svg{width:34px;height:34px}
.trash .n{font:600 13.5px/1.25 var(--font)}
.trash .d{margin-top:3px;font-size:12.5px;color:var(--text2);line-height:1.4}
.trash .by{font-size:12px;color:var(--text3);text-align:right;white-space:nowrap}
.trash .by button{color:var(--accent);font-weight:600}
.sheet{margin:14px 16px;padding:12px 14px;border-radius:10px;background:var(--chip);font-size:13px;line-height:1.45}
.help{padding:22px 26px;font-size:14px;line-height:1.55}
.help p+p{margin-top:10px}

/* ---------------------------------------------------------------- step 3: Spotlight, Terminal, Settings */
:root{--ios-bg:#fff;--ios-bar:#f9f9f9;--set-bg:#f2f2f7;--set-cell:#fff;--io-wd:rgba(255,255,255,.3)}
:root[data-theme=dark]{--ios-bg:#000;--ios-bar:#1c1c1e;--set-bg:#000;--set-cell:#1c1c1e;--io-wd:rgba(40,40,44,.42)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--ios-bg:#000;--ios-bar:#1c1c1e;--set-bg:#000;--set-cell:#1c1c1e;--io-wd:rgba(40,40,44,.42)}}
.spot{position:fixed;inset:0;z-index:980}
.spot[hidden]{display:none}
.sp-box{position:absolute;left:0;right:0;top:max(84px,17vh);width:min(700px,calc(100% - 32px));margin:0 auto;border-radius:18px;background:var(--glass);-webkit-backdrop-filter:blur(40px) saturate(1.8);backdrop-filter:blur(40px) saturate(1.8);border:.5px solid var(--edge);box-shadow:0 30px 80px rgba(0,0,0,.35),0 0 0 .5px rgba(0,0,0,.2);overflow:hidden}
.sp-bar{position:relative;display:flex;align-items:center;gap:12px;height:58px;padding:0 18px}
.sp-bar>svg{width:21px;height:21px;flex:none;color:var(--text2)}
.sp-in{flex:1;min-width:0;border:0;background:transparent;outline:none;font:400 22px/1.2 var(--font);color:var(--text)}
.sp-in::placeholder{color:var(--text3)}
.sp-x{display:none}
.sp-try{display:flex;align-items:center;flex-wrap:wrap;gap:6px;padding:0 18px 14px 51px;font-size:12.5px;color:var(--text3)}

    kms: { org: 'KMS', orgSub: 'Keppt · two power plants', period: '12/2023 – today', role: 'Sole developer, my own system', context: 'Two combined-cycle power plants, 730 MW and 650 MW', stack: 'Python, Django, PostgreSQL, HTMX, Docker, OAuth2, MCP', live: true,
      title: 'Two power plants replaced a Siemens system with software I built.',
      sum: 'KMS is the system two power plants run on, from repairs and safety permits to stores, HR and attendance. Engineers at both plants start their day in it, and no one works on live equipment until it is switched off, locked and approved in KMS.',

      see: ['One morning at a plant', 'In this drawing, a pump needs a repair. It is switched off and locked before anyone touches it, and then a manager asks the AI a question.'],
      guide: [['Every repair is tracked', 'Each fault and repair job at the plants is a work order in KMS. There are 20,000+ so far.'], ['Safe before work starts', 'The machine is switched off and locked at every point. Operations approve, and only then does the job begin.'], ['Ask in plain words', 'Managers ask a question, and AI answers from the plant’s own records. It can read, but never change anything.']],
      intro: 'Siemens charged per feature and per user, and every change took days to a month to show up. A friend told me the company needed someone. I met its head, and three months later KMS was in use.',

      built: ['Maintenance first, then operations, stores, HR, attendance, training and overtime, built together with the plants’ engineers.', 'Six safety permit types and an isolation lockout that must be approved before anyone works on live equipment.', 'An OAuth2 MCP server with 16 read-only tools, so heads of department ask AI for their reports, from failure trends to the maintenance backlog.', 'The plant’s day starts in it: operations open KMS at 6:00, maintenance at 7:00, and the head of the station watches it all.'],

    apicbase: { org: 'Apicbase', orgSub: 'Belgian food-tech SaaS', period: '05/2023 – today', role: 'Full Stack Developer', context: 'Remote from Baghdad, clients across Europe', stack: 'Python, Django, DRF, PostgreSQL, Celery, Amazon SQS, Redis, Vue 3', live: true,
      title: '500+ client locations run their stock on the pipeline I built and own.',
      sum: 'Apicbase is software that restaurant groups, hotels and caterers use for recipes, purchasing and stock. I built and own the part that keeps the stock right. Every delivery, count and waste entry from 500+ client locations goes through it.',
      line: 'Kitchen stock for 500+ client locations', tag: 'Kitchen stock',
      see: ['Where a stock change goes', 'This drawing follows a day of deliveries, counts and waste from three locations, all the way into the stock.'],
      guide: [['Changes come in', 'Each location sends its stock changes all day: deliveries, counts and waste.'], ['One line per location', 'Each location’s changes wait in their own line, so they are applied in the order they happened.'], ['In the background', 'A worker updates the stock behind the scenes, so nobody waits on a slow page.'], ['Confirmed live', 'Staff see each change go from waiting to done, without reloading the page.']],
      intro: 'I sent back their 7-day hiring task in under 30 hours, and the CTO hired me as the first Arab developer on the team. Small features first, then they gave me the stock pipeline.',
      metrics: [{ v: '500+', l: 'client locations on the pipeline' }, { v: '0', l: 'clients rolled back' }, { f: '25 s', v: '< 1 s', l: 'slowest inventory page' }, { f: '2 h', v: '49 min', l: 'tests for every change' }, { f: '16 min', v: '6 s', l: 'test database, per shard' }],

      sum: 'KMS ist das System, auf dem zwei Kraftwerke laufen, von Reparaturen und Arbeitsfreigaben bis zu Lager, Personal und Zeiterfassung. Die Ingenieure beider Kraftwerke beginnen ihren Tag darin, und niemand arbeitet an laufenden Anlagen, bevor sie in KMS abgeschaltet, gesichert und freigegeben sind.',
      line: 'Das System, auf dem zwei Kraftwerke laufen', tag: 'Kraftwerke',
      see: ['Ein Morgen im Kraftwerk', 'In dieser Zeichnung muss eine Pumpe repariert werden. Sie wird abgeschaltet und gesichert, bevor jemand sie anfasst, und danach stellt eine Führungskraft der KI eine Frage.'],
      guide: [['Jede Reparatur erfasst', 'Jede Störung und jeder Reparaturauftrag in den Kraftwerken ist ein Arbeitsauftrag in KMS. Bisher über 20.000.'], ['Sicher vor Arbeitsbeginn', 'Die Anlage wird an jeder Stelle abgeschaltet und gesichert. Der Betrieb gibt frei, und erst dann beginnt die Arbeit.'], ['Fragen in normalen Worten', 'Führungskräfte stellen eine Frage, und die KI antwortet aus den Daten des Kraftwerks. Sie kann lesen, aber nichts ändern.']],

      metrics: [{ v: '2', l: 'Kraftwerke laufen auf KMS' }, { v: '20.000+', l: 'Arbeitsaufträge' }, { v: '6.500+', l: 'Störmeldungen' }, { v: '400+', l: 'Ingenieure nutzen es täglich' }, { v: '3 Monate', l: 'vom ersten Gespräch bis live' }],
      built: ['Zuerst die Instandhaltung, dann Betrieb, Lager, Personal, Zeiterfassung, Schulungen und Überstunden, gemeinsam mit den Ingenieuren der Kraftwerke.', 'Sechs Arten von Arbeitsfreigaben und eine Freischaltung, die genehmigt sein muss, bevor jemand an laufenden Anlagen arbeitet.', 'Ein OAuth2-MCP-Server mit 16 Werkzeugen nur zum Lesen: Abteilungsleitungen holen sich ihre Berichte per KI, von Ausfalltrends bis zum Wartungsrückstand.', 'Der Tag im Kraftwerk beginnt darin: Der Betrieb öffnet KMS um 6:00, die Instandhaltung um 7:00, und die Kraftwerksleitung behält alles im Blick.'],

    apicbase: { org: 'Apicbase', orgSub: 'Belgisches Food-Tech-SaaS', period: '05/2023 – heute', role: 'Full Stack Developer', context: 'Remote aus Bagdad, Kunden in ganz Europa', stack: 'Python, Django, DRF, PostgreSQL, Celery, Amazon SQS, Redis, Vue 3', live: true,

      line: 'Küchenbestand für 500+ Kundenstandorte', tag: 'Küchenbestand',

  return w.animate([{ transform: 'none', borderRadius: '0px', opacity: 1 }, { ...iosZoom(r), opacity: .3 }], { duration: 380, easing: 'cubic-bezier(.3,.6,.2,1)', fill: 'forwards' }).finished;
}

// ------------------------------------------------------------------ windows
let LAST_TAP = null;                   // the home-screen icon that was just tapped, so its app can grow out of it
const WINS = {}; let Z = 20, CASCADE = 0;
function openWin(key, arg) {
  const id = arg ? `${key}:${arg}` : key, ex = WINS[key === 'files' ? 'files' : id];
  if (ex) { LAST_TAP = null; if (key === 'files' && arg) { ex.dataset.arg = arg; fillWin(ex); } if (ex.classList.contains('min')) restoreWin(ex); else focusWin(ex); return ex; }
  const A = APPS[key], w = document.createElement('section'), src = LAST_TAP, prev = mobile() ? frontWin() : null; LAST_TAP = null;
  w.className = 'win'; w.dataset.id = key === 'files' ? 'files' : id; w.dataset.key = key; if (arg) w.dataset.arg = arg;
  w.setAttribute('role', 'dialog');
  w.innerHTML = '<div class="tb"><button class="back" type="button"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M12.5 4l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg><span></span></button><div class="lights"><button class="c" aria-label="Close"></button><button class="m" aria-label="Minimize"></button><button class="x" aria-label="Zoom"></button></div><div class="ttl"></div><div class="tbx"></div></div><div class="wc"></div><div class="rz" aria-hidden="true"></div>';
  const vw = innerWidth, vh = innerHeight, width = Math.min(A.size[0], vw - 24), off = (CASCADE++ % 6) * 26;
  const left = A.at ? A.at(width) : Math.max(12, Math.min((vw - width) / 2 - 40 + off, vw - width - 130));
  const top = Math.max(40, Math.min(58 + off, vh - 280));

  if (A.size[1]) w.style.height = Math.min(A.size[1], vh - top - 100) + 'px'; else w.style.maxHeight = (vh - top - 100) + 'px';
  if (prev) w.dataset.back = prev.dataset.id;
  $('#wins').appendChild(w); WINS[w.dataset.id] = w;
  fillWin(w); wireWin(w); focusWin(w); bounce(key);
  if (mobile()) iosIn(w, src, !!prev);
  return w;
}
function fillWin(w) {

  if (bk) bk.textContent = pw ? (pw.querySelector('.ttl').textContent || APPS[pw.dataset.key].name(pw.dataset.arg)) : U().ios.home;
}
function focusWin(w) {

  w.classList.add('front'); paintMenubar(); paintDock();
}
function frontWin() { return [...document.querySelectorAll('.win:not(.min):not(.closing)')].sort((a, b) => b.style.zIndex - a.style.zIndex)[0] || null; }
function closeWin(w) {
  if (w._closing) return; w._closing = true;
  if (w._stop) w._stop(); delete WINS[w.dataset.id]; dropMini(w); w.classList.add('closing');
  const done = () => { w.remove(); const f = frontWin(); if (f) focusWin(f); else { paintMenubar(); paintDock(); } };
  if (mobile() && !reduced()) iosOut(w).then(done, done); else done();
}
function flyTo(w, el, out) {          // the window shrinks into the dock, or grows out of it
  const r = w.getBoundingClientRect(), d = el.getBoundingClientRect();
  const dx = d.left + d.width / 2 - (r.left + r.width / 2), dy = d.top + d.height / 2 - (r.top + r.height / 2);
  const small = { transform: `translate(${dx}px,${dy}px) scale(${Math.max(.04, d.width / r.width)},${Math.max(.03, d.height / r.height)})`, opacity: .35 }, big = { transform: 'none', opacity: 1 };

}
async function minimizeWin(w) {

  await flyTo(w, mini, true);

}
async function restoreWin(w) {
  const mini = document.querySelector(`.dk.mini[data-win="${CSS.escape(w.dataset.id)}"]`);

  if (mini) { await flyTo(w, mini, false); dropMini(w); }
}
function wireWin(w) {
  w.addEventListener('pointerdown', () => focusWin(w));
  w.querySelector('.c').onclick = e => { e.stopPropagation(); closeWin(w); };
  w.querySelector('.m').onclick = e => { e.stopPropagation(); minimizeWin(w); };
  w.querySelector('.x').onclick = e => { e.stopPropagation(); w.classList.toggle('max'); };
  w.querySelector('.back').onclick = e => { e.stopPropagation(); closeWin(w); };
  const tb = w.querySelector('.tb');
  tb.addEventListener('dblclick', e => { if (!mobile() && !e.target.closest('.lights,.back')) w.classList.toggle('max'); });
  tb.addEventListener('pointerdown', e => {
    if (e.target.closest('.lights,button,a') || mobile() || w.classList.contains('max')) return;
    const sx = e.clientX, sy = e.clientY, ox = w.offsetLeft, oy = w.offsetTop; tb.setPointerCapture(e.pointerId);
    const mv = ev => { w.style.left = Math.min(Math.max(ox + ev.clientX - sx, 80 - w.offsetWidth), innerWidth - 80) + 'px'; w.style.top = Math.min(Math.max(oy + ev.clientY - sy, 28), innerHeight - 60) + 'px'; };
    const up = () => { tb.removeEventListener('pointermove', mv); tb.removeEventListener('pointerup', up); };
    tb.addEventListener('pointermove', mv); tb.addEventListener('pointerup', up);
  });
  const rz = w.querySelector('.rz');
  rz.addEventListener('pointerdown', e => {
    e.stopPropagation(); const sx = e.clientX, sy = e.clientY, ow = w.offsetWidth, oh = w.offsetHeight; rz.setPointerCapture(e.pointerId);
    w.style.maxHeight = 'none';
    const mv = ev => { w.style.width = Math.max(320, ow + ev.clientX - sx) + 'px'; w.style.height = Math.max(200, oh + ev.clientY - sy) + 'px'; };
    const up = () => { rz.removeEventListener('pointermove', mv); rz.removeEventListener('pointerup', up); };
    rz.addEventListener('pointermove', mv); rz.addEventListener('pointerup', up);
  });
}

// ------------------------------------------------------------------ the dock
function iconFor(key, arg) {
  if (key === 'project') return appIcon(arg, 54);
  if (key === 'preview') return ICON.pdf;
  if (key === 'about') return `<span class="appic" style="width:100%;height:100%;border-radius:23%;background:linear-gradient(160deg,#33496a,#141c29);font:700 17px/1 var(--font)">HA</span>`;
  return ICON[key] || ICON.files;
}
function renderDock() {
  const u = U();
  $('#dock').innerHTML = DOCK.map(k => `<button class="dk" data-app="${k}" aria-label="${esc(APPS[k].name())}"><span class="ic">${ICON[k]}</span><span class="tip">${esc(APPS[k].name())}</span></button>`).join('')
    + '<span class="dsep" aria-hidden="true"></span><span id="minis" style="display:contents"></span>'
    + `<button class="dk" data-app="trash" aria-label="${esc(u.trash)}"><span class="ic">${ICON.trash}</span><span class="tip">${esc(u.trash)}</span></button>`;
  document.querySelectorAll('.win.min').forEach(addMini);
  paintDock();
}
function addMini(w) {                  // a minimized window waits in the dock, next to the Trash
  let m = document.querySelector(`.dk.mini[data-win="${CSS.escape(w.dataset.id)}"]`);
  if (m) return m;
  m = document.createElement('button'); m.className = 'dk mini'; m.dataset.win = w.dataset.id;
  const name = w.querySelector('.ttl').textContent || APPS[w.dataset.key].name(w.dataset.arg);
  m.setAttribute('aria-label', name);
  m.innerHTML = `<span class="ic">${iconFor(w.dataset.key, w.dataset.arg)}</span><span class="tip">${esc(name)}</span>`;
  $('#minis').appendChild(m);
  return m;
}
function dropMini(w) { const m = document.querySelector(`.dk.mini[data-win="${CSS.escape(w.dataset.id)}"]`); if (m) m.remove(); }
function paintDock() {
  document.querySelectorAll('.dk[data-app]').forEach(b => { const k = b.dataset.app; b.classList.toggle('on', Object.values(WINS).some(w => w.dataset.key === k)); });
}
function bounce(key) {
  const b = document.querySelector(`.dk[data-app="${key}"]`); if (!b || reduced()) return;
  b.animate([{ transform: 'none' }, { transform: 'translateY(-16px)' }, { transform: 'none' }, { transform: 'translateY(-7px)' }, { transform: 'none' }], { duration: 640, easing: 'ease-out' });
}
$('#dock').addEventListener('click', e => {
  const b = e.target.closest('.dk'); if (!b) return;
  if (b.classList.contains('mini')) { const w = WINS[b.dataset.win]; if (w) restoreWin(w); return; }
  const k = b.dataset.app, mine = Object.values(WINS).filter(w => w.dataset.key === k);
  const hidden = mine.find(w => w.classList.contains('min'));
  if (hidden) restoreWin(hidden); else if (mine.length) focusWin(mine.sort((a, b2) => b2.style.zIndex - a.style.zIndex)[0]); else openWin(k);
});
$('#dock').addEventListener('mousemove', e => {          // icons grow under the pointer, like the real dock
  if (reduced() || mobile()) return;
  document.querySelectorAll('.dk').forEach(b => {
    const r = b.getBoundingClientRect(), d = Math.abs(e.clientX - (r.left + r.width / 2)), s = 54 * (1 + .55 * Math.max(0, 1 - d / 130));
    b.style.width = b.style.height = s + 'px';
  });
});
$('#dock').addEventListener('mouseleave', () => document.querySelectorAll('.dk').forEach(b => (b.style.width = b.style.height = '')));

// ------------------------------------------------------------------ the menu bar and its menus
function paintMenubar() {
  const u = U(), f = frontWin(), name = f ? APPS[f.dataset.key].name(f.dataset.arg) : u.desktop;
  $('#menubar').innerHTML = `<button class="logo" data-menu="sys" aria-label="Menu">HA</button><span class="mi app">${esc(name)}</span>
    <button class="appmenu" data-menu="file">${esc(u.mFile)}</button><button class="appmenu" data-menu="window">${esc(u.mWindow)}</button><button class="appmenu" data-menu="help">${esc(u.mHelp)}</button>
    <span class="sp"></span>
    <button data-act="lang" aria-label="${esc(u.switchLang)}" title="${esc(u.switchLang)}">${LANG.toUpperCase()}</button>
    <button data-act="theme" aria-label="${esc(u.theme)}" title="${esc(u.theme)}"><svg width="15" height="15" viewBox="0 0 16 16" fill="currentColor"><path d="M8 1.5a6.5 6.5 0 1 0 0 13z"/><circle cx="8" cy="8" r="6.5" fill="none" stroke="currentColor" stroke-width="1.3"/></svg></button>
    <button data-act="spot" aria-label="${esc(u.spot.label)}" title="${esc(u.spot.label)} (${MOD}K)"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="7" cy="7" r="5"/><path d="M11 11l3.5 3.5"/></svg></button>
    <span class="mi clock" id="mclock" title="${esc(u.clockTitle)}"></span>`;
  tick();
}
const MENUS = {
  sys: () => { const u = U(), t = store.get('theme') || 'auto'; return [
    { l: u.menuAbout, a: () => openWin('about') }, '-',
    { l: u.menuSimple + ' ↗', a: () => window.open(STORY, '_blank', 'noopener') }, '-',
    { l: u.auto, c: t === 'auto', a: () => setTheme('auto') }, { l: u.light, c: t === 'light', a: () => setTheme('light') }, { l: u.dark, c: t === 'dark', a: () => setTheme('dark') }, '-',
    { l: 'English', c: LANG === 'en', a: () => setLang('en') }, { l: 'Deutsch', c: LANG === 'de', a: () => setLang('de') }]; },
  file: () => { const u = U(); return [{ l: u.closeWin, k: 'esc', a: () => { const f = frontWin(); if (f) closeWin(f); } }, { l: u.downloadCv, a: () => { const a = document.createElement('a'); a.href = CV; a.download = ''; a.click(); } }]; },
  window: () => { const u = U(); return [{ l: u.minimize, a: () => { const f = frontWin(); if (f) minimizeWin(f); } }, { l: u.zoom, a: () => { const f = frontWin(); if (f) f.classList.toggle('max'); } }, '-', { l: u.allFront, a: () => document.querySelectorAll('.win.min').forEach(restoreWin) }]; },
  help: () => [{ l: U().howTo, a: () => openWin('help') }]
};
let POPFOR = null;
function showMenu(btn) {
  const pop = $('#pop'), items = MENUS[btn.dataset.menu]();
  pop.innerHTML = items.map((it, i) => it === '-' ? '<hr>' : `<button data-i="${i}"><span class="chk">${it.c ? '✓' : ''}</span>${esc(it.l)}${it.k ? `<span class="k">${esc(it.k)}</span>` : ''}</button>`).join('');
  const r = btn.getBoundingClientRect(); pop.style.left = Math.min(r.left, innerWidth - 250) + 'px'; pop.style.top = (r.bottom + 4) + 'px';
  pop.hidden = false; POPFOR = btn.dataset.menu;
  document.querySelectorAll('.menubar .open').forEach(b => b.classList.remove('open')); btn.classList.add('open');
  pop.onclick = e => { const b = e.target.closest('button[data-i]'); if (!b) return; hideMenu(); items[+b.dataset.i].a(); };
}
function hideMenu() { $('#pop').hidden = true; POPFOR = null; document.querySelectorAll('.menubar .open').forEach(b => b.classList.remove('open')); }
$('#menubar').addEventListener('click', e => {
  const m = e.target.closest('[data-menu]'); if (m) { e.stopPropagation(); if (POPFOR === m.dataset.menu) hideMenu(); else showMenu(m); return; }
  const a = e.target.closest('[data-act]'); if (!a) return;
  if (a.dataset.act === 'lang') setLang(LANG === 'en' ? 'de' : 'en');
  if (a.dataset.act === 'theme') { const t = store.get('theme') || 'auto', dark = t === 'dark' || (t === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches); setTheme(dark ? 'light' : 'dark'); }
});
document.addEventListener('click', e => { if (!e.target.closest('#pop')) hideMenu(); });

// ------------------------------------------------------------------ the desktop and the widget
function renderDesk() {
  const a = C().apps, c = C().cases;
  $('#desk').innerHTML = `<p class="dhd">${esc(U().projects)}</p>` + ORDER.map(id => `<button class="dicon" data-open="project:${id}"><span class="art">${appIcon(id, 60)}</span><span class="lbl">${esc(a[id])}<small>${esc(c[id].tag)}</small></span></button>`).join('')
    + `<button class="dicon cv" data-open="preview"><span class="art">${ICON.pdf.replace('<svg', '<svg width="60" height="60"')}</span><span class="lbl">${esc(a.cv)}</span></button>`;
}
function baghdadNow() {
  const p = new Intl.DateTimeFormat('en-GB', { timeZone: 'Asia/Baghdad', hour: 'numeric', minute: 'numeric', second: 'numeric', hour12: false }).formatToParts(new Date());
  const g = t => +p.find(x => x.type === t).value; return { h: g('hour') % 24, m: g('minute'), s: g('second') };
}
function drawClock() {
  let ticks = '';
  for (let i = 0; i < 60; i++) { const a = i * 6 * Math.PI / 180, big = i % 5 === 0, r1 = big ? 58 : 63, r2 = 68; ticks += `<line x1="${75 + r1 * Math.sin(a)}" y1="${75 - r1 * Math.cos(a)}" x2="${75 + r2 * Math.sin(a)}" y2="${75 - r2 * Math.cos(a)}" stroke="#1d1d1f" stroke-width="${big ? 1.6 : .7}" opacity="${big ? .85 : .4}"/>`; }
  const nums = [[12, 75, 31], [3, 120, 81], [6, 75, 128], [9, 30, 81]].map(([t, x, y]) => `<text x="${x}" y="${y}" text-anchor="middle" font-size="18" font-weight="600" fill="#1d1d1f" font-family="-apple-system,Inter,sans-serif">${t}</text>`).join('');
  const face = `<circle cx="75" cy="75" r="72" fill="#fff"/>${ticks}${nums}<text x="75" y="104" text-anchor="middle" font-size="9" font-weight="700" letter-spacing=".08em" fill="#8e8e93" font-family="-apple-system,Inter,sans-serif">${esc(U().baghdad)}</text>
    <line class="ck-h" x1="75" y1="75" x2="75" y2="44" stroke="#1d1d1f" stroke-width="4.5" stroke-linecap="round"/><line class="ck-m" x1="75" y1="75" x2="75" y2="25" stroke="#1d1d1f" stroke-width="3" stroke-linecap="round"/>
    <line class="ck-s" x1="75" y1="86" x2="75" y2="20" stroke="#F09A37" stroke-width="1.3"/><circle cx="75" cy="75" r="3.2" fill="#F09A37" stroke="#1d1d1f" stroke-width="1.2"/>`;
  document.querySelectorAll('svg.aclock').forEach(c => { c.innerHTML = face; c.setAttribute('aria-label', U().clockTitle); });
  tick();
}
function tick() {
  const { h, m, s } = baghdadNow(), set = (c, deg) => document.querySelectorAll('.aclock .' + c).forEach(el => el.setAttribute('transform', `rotate(${deg} 75 75)`));
  set('ck-h', (h % 12) * 30 + m * .5); set('ck-m', m * 6 + s * .1); set('ck-s', s * 6);
  const mc = $('#mclock'); if (mc) mc.textContent = new Intl.DateTimeFormat(LANG === 'de' ? 'de-DE' : 'en-GB', { timeZone: 'Asia/Baghdad', weekday: 'short', day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit', hour12: LANG !== 'de' }).format(new Date()).replace(',', '');
}

// ------------------------------------------------------------------ one click handler for everything that opens or acts
document.addEventListener('click', e => {
  const o = e.target.closest('[data-open]');
  if (o) { e.preventDefault(); LAST_TAP = o.closest('#ios') ? o : null; const [k, a] = o.dataset.open.split(':'); openWin(k, a); if (o.classList.contains('dicon')) { document.querySelectorAll('.dicon.sel').forEach(x => x.classList.remove('sel')); o.classList.add('sel'); } return; }
  if (e.target.closest('[data-act="spot"]')) { openSpot(); return; }
  const st = e.target.closest('[data-set]'); if (st) { const [k, v] = st.dataset.set.split(':'); if (k === 'theme') setTheme(v); else if (v !== LANG) setLang(v); return; }
  const w = e.target.closest('.win');
  const pl = e.target.closest('[data-place]'); if (pl && w) { w.dataset.arg = pl.dataset.place; fillWin(w); return; }
  const sk = e.target.closest('[data-skill]'); if (sk && w) { w.dataset.arg = sk.dataset.skill; fillWin(w); return; }
  const act = e.target.closest('.win [data-act]'); if (!act || !w) return;
  if (act.dataset.act === 'send') { const sub = w.querySelector('#msub').value, body = w.querySelector('#mbody').value; location.href = `mailto:${EMAIL}?subject=${encodeURIComponent(sub)}&body=${encodeURIComponent(body)}`; }
  if (act.dataset.act === 'walk') { w.querySelector('#msub').value = U().walkSubject; w.querySelector('#mbody').focus(); }
  if (act.dataset.act === 'empty') { w.dataset.arg = '1'; fillWin(w); }
});
$('#desk').addEventListener('click', e => { if (!e.target.closest('.dicon')) document.querySelectorAll('.dicon.sel').forEach(x => x.classList.remove('sel')); });
document.addEventListener('keydown', e => {
  if ((e.metaKey || e.ctrlKey) && !e.altKey && e.key.toLowerCase() === 'k') { e.preventDefault(); if (SPOT.open) closeSpot(); else openSpot(); return; }
  if (e.key === '/' && !SPOT.open && !e.target.closest('input,textarea,[contenteditable]')) { e.preventDefault(); openSpot(); return; }
  if (e.key !== 'Escape') return;
  if (SPOT.open) { closeSpot(); return; }
  if (!$('#pop').hidden) { hideMenu(); return; }
  if (e.target.closest('.term')) return;   // Esc in the terminal is just a key
  const f = frontWin(); if (f) closeWin(f);
});

function setLang(l) {
  LANG = l; document.documentElement.lang = l; store.set('lang', l);
  renderDesk(); renderDock(); renderIOS(); drawClock(); paintMenubar();
  Object.values(WINS).forEach(fillWin);
  if (SPOT.open) { const q = $('#spq').value; closeSpot(); openSpot(q); }
}
// ------------------------------------------------------------------ start
document.documentElement.lang = LANG;
setWallpaper(); renderDesk(); renderDock(); renderIOS(); drawClock(); paintMenubar(); setInterval(tick, 1000);
if (!mobile()) openWin('about');   // on a phone the home screen is the first thing, with his card on top
</script>
