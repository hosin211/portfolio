<body data-tone="teal" data-mode="profile">
<!-- outline numerals: a ring grown from the filled glyph, so overlapping contours never show -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <filter id="ol-teal" x="-5%" y="-5%" width="110%" height="110%" color-interpolation-filters="sRGB"><feMorphology in="SourceAlpha" operator="dilate" radius="2.5" result="d"/><feComposite in="d" in2="SourceAlpha" operator="out" result="r"/><feFlood flood-color="#0E857A"/><feComposite in2="r" operator="in"/></filter>
  <filter id="ol-ind" x="-5%" y="-5%" width="110%" height="110%" color-interpolation-filters="sRGB"><feMorphology in="SourceAlpha" operator="dilate" radius="2.5" result="d"/><feComposite in="d" in2="SourceAlpha" operator="out" result="r"/><feFlood flood-color="#4055B4"/><feComposite in2="r" operator="in"/></filter>
  <filter id="ol-amb" x="-5%" y="-5%" width="110%" height="110%" color-interpolation-filters="sRGB"><feMorphology in="SourceAlpha" operator="dilate" radius="2.5" result="d"/><feComposite in="d" in2="SourceAlpha" operator="out" result="r"/><feFlood flood-color="#C47915"/><feComposite in2="r" operator="in"/></filter>
</svg>

      <button class="back" id="toProfile" type="button"><span class="ico">←</span><span class="lbl">Profile</span></button>

      <div class="lang" role="group" aria-label="Language / Sprache"><button type="button" data-lang="en">EN</button><button type="button" data-lang="de">DE</button></div>
      <button class="play" id="tour" type="button"><span class="ico">▶</span><span class="lbl">Play the story</span></button>
      <button class="story-btn" id="toStory" type="button"><span class="lbl">My story</span><span class="ico">→</span></button>

        <button class="step" id="next" type="button" aria-label="Next">→</button>
      </footer>
    </section>
  </div>
</div>
